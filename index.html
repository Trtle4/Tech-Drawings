<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Dieline Studio</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Hanken+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
/* ==========================================================================
   Parametric Tools — shared design system
   --------------------------------------------------------------------------
   Ported from the Cookie Tray Sizer (Trtle4/Cookie-Tray web/src/style.css),
   which is the reference implementation of parametric_design_system.md. Tokens,
   type, fields, segmented controls, messages, toolbar, title block and the
   mobile "overlay drops below the canvas" rule are lifted as-is so the two apps
   read as one family.

   Accent is the shared petrol teal — no per-app hue.

   What this app adds, because it draws technical drawings rather than
   rendering a product:
     - line-type tokens (cut / crease / perf / score / bleed / dimension)
     - a split viewport: 2D drawing and 3D preview side by side, persistent
     - an "unfolded geometry" list in the control column
   ========================================================================== */

:root {
  /* surfaces — cool paper, not cream */
  --paper: #e9edf0;
  --panel: #ffffff;
  --panel-2: #f3f6f8;
  --recess: #e7ecef;

  /* ink */
  --ink: #192227;
  --ink-2: #59656c;
  --ink-3: #8a959b;

  /* lines */
  --line: #d2d9de;
  --line-2: #e3e8eb;
  --grid: #dbe1e6;

  /* accent — quiet petrol teal, PRIMARY ACTIONS ONLY */
  --accent: #0f6e77;
  --accent-2: #0b565d;
  --accent-soft: #e0f0f1;

  /* semantic state — identical across every app in the family */
  --valid: #2f7d5b;
  --valid-soft: #e4f3ea;
  --warn: #b0740f;
  --warn-soft: #fbf0d8;
  --warn-border: #ead9a8;
  --danger: #b23a2e;
  --danger-soft: #fbe6e3;
  --danger-border: #f0c3bc;

  /* domain colours — this app renders board, not product */
  --board: #d8c9ae;
  --board-edge: #b39b76;
  --board-white: #f2f0ea;

  /* drafting line conventions. Cut is ink; every fold type is accent so the
     drawing reads as "structure vs. fold" at a glance. */
  --l-cut: var(--ink);
  --l-crease: var(--accent);
  --l-perf: var(--accent);
  --l-score: var(--accent);
  --l-bleed: var(--ink-3);
  --l-dimension: var(--ink-2);
  --l-construction: var(--line);

  /* Height of the strip at the foot of the 2D pane kept clear for the title
     block and the scale chip. */
  --titleblock-clear: 312px;

  --r: 9px;
  --r-sm: 6px;
  --sans: "Hanken Grotesk", system-ui, sans-serif;
  --mono: "DM Mono", ui-monospace, "SF Mono", monospace;
  --ease: cubic-bezier(0.25, 0.8, 0.4, 1);
}

* {
  box-sizing: border-box;
}

html,
body {
  margin: 0;
  height: 100%;
}

body {
  font-family: var(--sans);
  color: var(--ink);
  background: var(--paper);
  font-size: 14px;
  line-height: 1.45;
  -webkit-font-smoothing: antialiased;
}

/* Anything showing a live-updating measurement gets tabular figures so digits
   don't jitter/reflow as values change. */
.mono,
input,
.tbrow .v,
.ms-grid b,
.dim,
.brand .part,
.eyebrow {
  font-variant-numeric: tabular-nums;
}

:focus-visible {
  outline: 2px solid var(--accent);
  outline-offset: 2px;
}

#app {
  display: flex;
  flex-direction: column;
  height: 100vh;
  min-height: 0;
}

/* ---------- header ---------- */
#topbar {
  display: flex;
  align-items: center;
  gap: 20px;
  padding: 0 20px;
  height: 56px;
  flex: none;
  background: var(--panel);
  border-bottom: 1px solid var(--line);
}

.brand {
  display: flex;
  align-items: baseline;
  gap: 10px;
}

.brand h1 {
  font-size: 16px;
  font-weight: 600;
  letter-spacing: -0.01em;
  margin: 0;
}

.brand .part {
  font-family: var(--mono);
  font-size: 11px;
  color: var(--ink-3);
  letter-spacing: 0.04em;
  padding: 2px 7px;
  border: 1px solid var(--line);
  border-radius: 20px;
}

#topbar .spacer {
  flex: 1;
}

#build-status {
  display: flex;
  align-items: center;
  gap: 7px;
  font-size: 12px;
  font-weight: 500;
  color: var(--valid);
  margin-right: 4px;
  white-space: nowrap;
}

#build-status .dot {
  width: 7px;
  height: 7px;
  border-radius: 50%;
  background: currentColor;
  box-shadow: 0 0 0 3px color-mix(in srgb, currentColor 18%, transparent);
  opacity: 0.9;
}

#build-status.error {
  color: var(--danger);
}

#build-status.building {
  color: var(--ink-2);
}

#export-control {
  display: flex;
  align-items: center;
  gap: 10px;
}

.btn {
  font-family: var(--sans);
  font-size: 13px;
  font-weight: 500;
  cursor: pointer;
  padding: 8px 15px;
  border-radius: var(--r-sm);
  border: 1px solid var(--line);
  background: var(--panel);
  color: var(--ink);
  transition: border-color 0.15s var(--ease), background 0.15s var(--ease);
}

.btn:hover {
  border-color: var(--ink-3);
}

.btn.primary {
  background: var(--accent);
  border-color: var(--accent);
  color: #fff;
}

.btn.primary:hover {
  background: var(--accent-2);
  border-color: var(--accent-2);
}

.btn:disabled {
  background: var(--panel-2);
  border-color: var(--line);
  color: var(--ink-3);
  cursor: not-allowed;
}

.btn .ic {
  font-family: var(--mono);
  opacity: 0.75;
  margin-right: 6px;
}

/* ---------- export dropdown ---------- */
#export-control {
  position: relative;
}

.export-menu {
  position: absolute;
  top: calc(100% + 6px);
  right: 0;
  z-index: 20;
  display: none;
  flex-direction: column;
  min-width: 180px;
  background: var(--panel);
  border: 1px solid var(--line);
  border-radius: var(--r-sm);
  box-shadow: 0 8px 24px rgba(20, 30, 40, 0.14);
  padding: 5px;
}

.export-menu.open {
  display: flex;
}

.export-item {
  display: flex;
  align-items: baseline;
  justify-content: space-between;
  gap: 10px;
  padding: 8px 10px;
  border-radius: 6px;
  font-family: var(--sans);
  font-size: 13px;
  font-weight: 500;
  color: var(--ink);
  text-decoration: none;
  cursor: pointer;
}

a.export-item:hover {
  background: var(--panel-2);
}

.export-item .fmt {
  font-family: var(--mono);
  font-size: 10.5px;
  color: var(--ink-3);
  letter-spacing: 0.06em;
}

.export-item.disabled {
  color: var(--ink-3);
  cursor: not-allowed;
}

/* ---------- body ---------- */
main {
  flex: 1;
  display: flex;
  min-height: 0;
}

/* ---------- control column ---------- */
#panel {
  width: 336px;
  flex: none;
  background: var(--panel);
  border-right: 1px solid var(--line);
  overflow-y: auto;
  padding: 6px 0 24px;
}

.group {
  padding: 16px 20px 4px;
  border-top: 1px solid var(--line-2);
}

.group:first-child {
  border-top: none;
}

.eyebrow {
  font-family: var(--mono);
  font-size: 10.5px;
  font-weight: 500;
  text-transform: uppercase;
  letter-spacing: 0.13em;
  color: var(--ink-3);
  margin-bottom: 12px;
  display: flex;
  align-items: center;
  gap: 8px;
}

.eyebrow .n {
  color: var(--accent);
}

/* ---------- pack type: category > style ---------- */
.nav-tree {
  display: flex;
  flex-direction: column;
  gap: 14px;
}

.nav-group-label {
  font-family: var(--mono);
  font-size: 10px;
  font-weight: 500;
  text-transform: uppercase;
  letter-spacing: 0.1em;
  color: var(--ink-3);
  margin-bottom: 6px;
}

.nav-group {
  display: flex;
  flex-direction: column;
  gap: 2px;
}

.nav-btn {
  display: block;
  width: 100%;
  text-align: left;
  border: none;
  background: transparent;
  cursor: pointer;
  border-radius: var(--r-sm);
  font-family: var(--sans);
  font-size: 13px;
  font-weight: 500;
  color: var(--ink-2);
  padding: 7px 9px;
  transition: background 0.15s var(--ease), color 0.15s var(--ease);
}

.nav-btn:hover {
  background: var(--panel-2);
}

.nav-btn.on {
  background: var(--accent-soft);
  color: var(--accent-2);
}

.field {
  margin-bottom: 13px;
}

.field > label,
.field > span.label {
  display: block;
  font-size: 12.5px;
  font-weight: 500;
  color: var(--ink-2);
  margin-bottom: 5px;
}

.field .in {
  display: flex;
  align-items: center;
  background: var(--panel);
  border: 1px solid var(--line);
  border-radius: var(--r-sm);
  overflow: hidden;
  transition: border-color 0.15s var(--ease), box-shadow 0.15s var(--ease);
}

.field .in:focus-within {
  border-color: var(--accent);
  box-shadow: 0 0 0 3px var(--accent-soft);
}

.field .in input {
  flex: 1;
  border: none;
  outline: none;
  background: transparent;
  font-family: var(--mono);
  font-size: 13px;
  font-weight: 500;
  color: var(--ink);
  padding: 8px 10px;
  width: 100%;
  min-width: 0;
}

.field .in .unit {
  font-family: var(--mono);
  font-size: 11.5px;
  color: var(--ink-3);
  padding: 0 10px;
  border-left: 1px solid var(--line-2);
  align-self: stretch;
  display: flex;
  align-items: center;
  white-space: nowrap;
}

/* Clamped by the compiler / rejected by a guard. Styled on the wrapper so the
   whole field including its unit chip reads as one unit. */
.field .in:has(input.clamped) {
  border-color: var(--accent);
  background: var(--accent-soft);
}

.field .in:has(input.invalid) {
  border-color: var(--danger);
  box-shadow: 0 0 0 3px var(--danger-soft);
}

.field .in:has(input.invalid) input {
  color: var(--danger);
}

.field select {
  width: 100%;
  padding: 8px 10px;
  font-family: var(--sans);
  font-size: 13px;
  color: var(--ink);
  background: var(--panel);
  border: 1px solid var(--line);
  border-radius: var(--r-sm);
}

.field select:focus-visible {
  border-color: var(--accent);
}

.row2 {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 11px;
}

.hint {
  font-family: var(--mono);
  font-size: 11px;
  color: var(--ink-3);
  margin-top: 4px;
}

.subgroup {
  padding: 2px 0 0;
  margin: -2px 0 13px;
  border-left: 2px solid var(--line);
  padding-left: 12px;
}

/* segmented control */
.seg {
  display: flex;
  background: var(--recess);
  border-radius: var(--r-sm);
  padding: 3px;
  gap: 3px;
}

.seg .seg-btn {
  flex: 1;
  border: none;
  background: transparent;
  cursor: pointer;
  padding: 6px 8px;
  font-family: var(--sans);
  font-size: 12.5px;
  font-weight: 500;
  color: var(--ink-2);
  border-radius: 4px;
  transition: background 0.15s var(--ease), box-shadow 0.15s var(--ease), color 0.15s var(--ease);
}

.seg .seg-btn.on {
  background: var(--panel);
  color: var(--ink);
  box-shadow: 0 1px 2px rgba(20, 30, 40, 0.12);
}

.visually-hidden {
  position: absolute !important;
  width: 1px !important;
  height: 1px !important;
  padding: 0 !important;
  margin: -1px !important;
  overflow: hidden !important;
  clip: rect(0 0 0 0) !important;
  white-space: nowrap !important;
  border: 0 !important;
}

/* ---------- messages ---------- */
#messages {
  padding: 4px 20px 12px;
}

#messages:empty {
  display: none;
}

.msg {
  display: flex;
  gap: 8px;
  align-items: flex-start;
  margin-top: 7px;
  border-radius: var(--r-sm);
  padding: 8px 10px;
  font-size: 11.5px;
  line-height: 1.4;
  animation: msg-in 0.18s var(--ease);
}

@keyframes msg-in {
  from {
    opacity: 0;
    transform: translateY(-3px);
  }
  to {
    opacity: 1;
    transform: none;
  }
}

.msg::before {
  font-family: var(--mono);
  font-weight: 600;
  line-height: 1.3;
}

.msg.warning {
  background: var(--warn-soft);
  border: 1px solid var(--warn-border);
  color: #7a5209;
}

.msg.warning::before {
  content: "!";
  color: var(--warn);
}

.msg.error {
  background: var(--danger-soft);
  border: 1px solid var(--danger-border);
  color: #7a2b21;
}

.msg.error::before {
  content: "×";
  color: var(--danger);
}

/* Unfolded geometry: things the drawing still shows but 3D cannot fold. It is
   advisory, never blocking, so it reads as a warning and not an error. */
.unfolded-list {
  list-style: none;
  margin: 0;
  padding: 0;
}

.unfolded-list li {
  display: flex;
  gap: 8px;
  align-items: baseline;
  padding: 7px 0;
  border-top: 1px solid var(--line-2);
  font-size: 11.5px;
  line-height: 1.4;
  color: var(--ink-2);
}

.unfolded-list li:first-child {
  border-top: none;
}

.unfolded-list .reason {
  font-family: var(--mono);
  font-size: 10px;
  letter-spacing: 0.05em;
  text-transform: uppercase;
  color: var(--warn);
  flex: none;
}

/* ---------- viewport: 2D drawing + 3D preview, side by side ---------- */
#viewport {
  position: relative;
  flex: 1;
  min-width: 0;
  overflow: hidden;
  background: radial-gradient(120% 90% at 50% 0%, #f4f7f8 0%, #e4e9ed 70%, #dce2e7 100%);
  display: flex;
}

/* The companion view is always on screen, never a separate mode reached by
   navigating away — the header picks which pane is primary (large) and which
   is the inset (narrow strip), and clicking the inset swaps them. Default,
   with no modifier class, is 2D primary. */
#pane-2d,
#pane-3d {
  position: relative;
  order: 2;
  width: 38%;
  min-width: 260px;
  flex: none;
  border-left: 1px solid var(--line);
  background: linear-gradient(180deg, #f1f4f6 0%, #dfe5ea 100%);
}

#viewport:not(.viewport-3d-primary) #pane-2d,
#viewport.viewport-3d-primary #pane-3d {
  order: 1;
  flex: 1;
  width: auto;
  min-width: 0;
  border-left: none;
  background: radial-gradient(120% 90% at 50% 0%, #f4f7f8 0%, #e4e9ed 70%, #dce2e7 100%);
}

/* Inset panes invite a click back to primary. */
#viewport.viewport-3d-primary #pane-2d,
#viewport:not(.viewport-3d-primary) #pane-3d {
  cursor: pointer;
}

#viewport.viewport-3d-primary #pane-2d:hover .pane-canvas,
#viewport:not(.viewport-3d-primary) #pane-3d:hover .pane-canvas {
  filter: brightness(1.04);
}

.pane-grid {
  position: absolute;
  inset: 0;
  background-image: linear-gradient(var(--grid) 1px, transparent 1px),
    linear-gradient(90deg, var(--grid) 1px, transparent 1px);
  background-size: 24px 24px;
  opacity: 0.55;
  pointer-events: none;
  mask-image: radial-gradient(130% 100% at 50% 40%, #000 55%, transparent 100%);
}

.pane-canvas {
  position: absolute;
  inset: 0;
  width: 100%;
  height: 100%;
  display: block;
  transition: opacity 0.15s var(--ease), filter 0.15s var(--ease);
}

/* Shown while the 3D rebuild is behind the 2D canvas mid-drag. */
.pane-canvas.stale {
  opacity: 0.4;
  filter: grayscale(70%);
}

.pane-label {
  position: absolute;
  top: 12px;
  left: 14px;
  z-index: 2;
  font-family: var(--mono);
  font-size: 10px;
  letter-spacing: 0.1em;
  text-transform: uppercase;
  color: var(--ink-3);
  pointer-events: none;
}

/* ---------- dimensions ---------- */
.dims-overlay {
  position: absolute;
  inset: 0;
  width: 100%;
  height: 100%;
  pointer-events: none;
  z-index: 2;
}

.dim {
  font-family: var(--mono);
  font-size: 12px;
  font-weight: 500;
  fill: var(--ink-2);
}

.dim-label-bg {
  fill: var(--paper);
  fill-opacity: 0.92;
}

.dimline {
  stroke: var(--l-dimension);
  stroke-width: 1;
}

.dim-ext {
  stroke: var(--ink-3);
  stroke-width: 1;
}

.dims-overlay,
.dims-overlay .dim-group {
  transition: opacity 0.15s var(--ease);
}

.dims-overlay.hidden {
  opacity: 0;
}

/* ---------- toolbar ---------- */
.viewport-toolbar {
  position: absolute;
  top: 16px;
  left: 50%;
  transform: translateX(-50%);
  display: flex;
  flex-wrap: wrap;
  justify-content: center;
  gap: 6px;
  align-items: center;
  z-index: 3;
  max-width: calc(100% - 24px);
  background: var(--panel);
  border: 1px solid var(--line);
  border-radius: 10px;
  padding: 5px;
  box-shadow: 0 4px 16px rgba(20, 30, 40, 0.08);
}

.toolbar-group {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: 2px;
}

.toolbar-group + .toolbar-group {
  padding-left: 5px;
  border-left: 1px solid var(--line-2);
}

.tbtn {
  border: none;
  background: transparent;
  cursor: pointer;
  border-radius: 6px;
  font-family: var(--sans);
  font-size: 12.5px;
  font-weight: 500;
  color: var(--ink-2);
  padding: 7px 11px;
  min-height: 44px;
  display: inline-flex;
  align-items: center;
  gap: 4px;
  transition: background 0.15s var(--ease), color 0.15s var(--ease);
}

.tbtn:hover {
  background: var(--panel-2);
}

.tbtn.on,
.tbtn:has(input:checked) {
  background: var(--accent-soft);
  color: var(--accent-2);
}

.tbtn input {
  position: absolute;
  width: 1px;
  height: 1px;
  opacity: 0;
  pointer-events: none;
}

.tbtn.icon {
  font-family: var(--mono);
  padding: 7px 10px;
}

.fold-slider {
  width: 120px;
  accent-color: var(--accent);
}

/* Toolbar's own type selector, e.g. the 2D editor's "Add line" type. */
.viewport-toolbar select {
  font-family: var(--sans);
  font-size: 12.5px;
  font-weight: 500;
  color: var(--ink);
  background: transparent;
  border: none;
  border-radius: 6px;
  padding: 7px 6px;
  min-height: 44px;
}

.pane-canvas.tool-select {
  cursor: default;
}

.pane-canvas.tool-draw {
  cursor: crosshair;
}

.pane-canvas.panning {
  cursor: grabbing;
}

.pane-canvas.orbiting {
  cursor: grabbing;
}

#pane-3d .pane-canvas {
  cursor: grab;
}

.handle-pt {
  cursor: grab;
}

/* The drawing never runs under the floating title block. Reserving a fixed
   strip is deterministic; sizing the reserve as a fraction of the blank is
   not, because the title block is a fixed pixel height while the blank's
   scale changes with its aspect ratio. */
#pane-2d .pane-canvas {
  bottom: var(--titleblock-clear);
}

/* The 3D pane is narrow; its toolbar docks at the bottom so it does not sit
   on top of the pane label. */
#pane-3d .viewport-toolbar {
  top: auto;
  bottom: 16px;
}

/* ---------- title block ---------- */
.titleblock {
  position: absolute;
  right: 22px;
  bottom: 22px;
  z-index: 3;
  width: 264px;
  background: var(--panel);
  border: 1px solid var(--ink);
  border-radius: 4px;
  box-shadow: 0 6px 22px rgba(20, 30, 40, 0.12);
  overflow: hidden;
  font-family: var(--mono);
  transition: opacity 0.15s var(--ease);
}

.tbhead {
  display: flex;
  justify-content: space-between;
  align-items: center;
  background: var(--ink);
  color: #fff;
  padding: 6px 10px;
  font-size: 10.5px;
  letter-spacing: 0.1em;
  text-transform: uppercase;
}

.tbrow {
  display: flex;
  border-top: 1px solid var(--line);
  font-size: 12px;
}

.tbrow:first-of-type {
  border-top: none;
}

.tbrow .k {
  width: 92px;
  flex: none;
  padding: 6px 10px;
  color: var(--ink-3);
  font-size: 10px;
  letter-spacing: 0.06em;
  text-transform: uppercase;
  border-right: 1px solid var(--line-2);
  display: flex;
  align-items: center;
}

.tbrow .v {
  padding: 6px 10px;
  color: var(--ink);
  font-weight: 500;
}

.tbrow .v b {
  color: var(--accent-2);
}

/* The free text field on the title block. */
.tbrow .v input {
  border: none;
  outline: none;
  background: transparent;
  font-family: var(--mono);
  font-size: 12px;
  font-weight: 500;
  color: var(--ink);
  width: 100%;
  padding: 0;
}

.scalechip {
  position: absolute;
  left: 22px;
  bottom: 22px;
  z-index: 3;
  font-family: var(--mono);
  font-size: 11px;
  color: var(--ink-3);
  background: var(--panel);
  border: 1px solid var(--line);
  border-radius: 20px;
  padding: 5px 12px;
}

#status-overlay {
  position: absolute;
  top: 16px;
  left: 16px;
  z-index: 4;
  padding: 6px 12px;
  background: var(--ink);
  color: #fff;
  border-radius: 20px;
  font-family: var(--mono);
  font-size: 11.5px;
  letter-spacing: 0.03em;
  pointer-events: none;
}

#status-overlay:empty,
#status-overlay.hidden {
  display: none;
}

.mobile-spec {
  display: none;
}

/* ---------- mobile ---------- */
@media (max-width: 820px) {
  /* Header wraps rather than pushing the page wider. Lifted from the Cookie
     Tray Sizer, which already handles this — the full-width zero-height
     spacer is what forces the wrap, so the status and the export controls
     land on their own row. */
  #topbar {
    flex-wrap: wrap;
    height: auto;
    min-height: 56px;
    padding: 10px 12px;
    gap: 8px 10px;
  }

  .brand .part {
    display: none;
  }

  #topbar .spacer {
    flex: 1 1 100%;
    height: 0;
  }

  #build-status {
    margin-right: auto;
  }

  /* Single continuous page scroll, top to bottom, one gesture. The desktop
     two-column layout's independently-scrolling #panel must not carry down
     here: it traps most of the control column behind an inner scrollbar a
     swipe over the viewport never reaches. */
  main {
    display: block;
  }

  #panel {
    width: 100%;
    max-height: none;
    overflow-y: visible;
    border-right: none;
    border-bottom: 1px solid var(--line);
  }

     at half a phone's width. */

    flex-direction: column;
    height: auto;
  }

    height: 46vh;
    min-height: 300px;
  }

  #pane-3d {
    width: 100%;
    height: 34vh;
    min-height: 220px;
    border-left: none;
    border-top: 1px solid var(--line);
  }

  /* Title block does not float over the drawing on narrow screens — it drops
     below as its own static spec panel, so the drawing takes the whole pane. */
  .titleblock {
    display: none;
  }

  #pane-2d .pane-canvas {
    bottom: 0;
  }

  .scalechip {
    left: 12px;
    bottom: 12px;
    font-size: 10px;
    padding: 4px 10px;
  }

  .viewport-toolbar {
    position: static;
    left: auto;
    transform: none;
    top: auto;
    margin: 8px auto;
    padding: 4px;
    gap: 4px;
  }

  .fold-slider {
    width: 90px;
  }

  .mobile-spec {
    display: block;
    background: var(--panel);
    border-top: 1px solid var(--line);
    padding: 12px 16px 16px;
  }

  .ms-head {
    display: flex;
    justify-content: space-between;
    align-items: center;
    font-family: var(--mono);
    font-size: 11px;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: var(--ink-2);
    margin-bottom: 10px;
  }

  .ms-ready {
    color: var(--valid);
  }

  .ms-ready.error {
    color: var(--danger);
  }

  .ms-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 8px;
  }

  .ms-grid > div {
    background: var(--panel-2);
    border: 1px solid var(--line-2);
    border-radius: var(--r-sm);
    padding: 8px 10px;
    display: flex;
    flex-direction: column;
    gap: 2px;
  }

  .ms-grid span {
    font-size: 10px;
    letter-spacing: 0.05em;
    text-transform: uppercase;
    color: var(--ink-3);
  }

  .ms-grid b {
    font-family: var(--mono);
    font-size: 13px;
    font-weight: 500;
    color: var(--ink);
  }
}

/* ---------- motion ---------- */
@media (prefers-reduced-motion: reduce) {
  * {
    transition-duration: 0.001ms !important;
    animation-duration: 0.001ms !important;
  }
}
